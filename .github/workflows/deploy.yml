name: Deploy Apps

on:
  push:
    branches:
      - "claude/peptide-dosage-tracker-0szvv"
      - "claude/cartoon-tracing-app-xy1kq5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r peptide-tracker _site/peptide-tracker
          cp -r cartoon-tracer  _site/cartoon-tracer
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Apps</title>
            <style>
              body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f1f5f9;
                     display: flex; flex-direction: column; align-items: center; justify-content: center;
                     min-height: 100vh; gap: 24px; margin: 0; padding: 24px; }
              h1 { font-size: 22px; color: #94a3b8; }
              a { display: block; padding: 18px 32px; background: #1e293b; border-radius: 14px;
                  color: #f1f5f9; text-decoration: none; font-size: 18px; font-weight: 600;
                  border: 1.5px solid #334155; text-align: center; min-width: 220px; }
              a:hover { border-color: #f59e0b; }
            </style>
          </head>
          <body>
            <h1>My Apps</h1>
            <a href="./cartoon-tracer/">Cartoon Tracer</a>
            <a href="./peptide-tracker/">Peptide Tracker</a>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
